*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

html,body{
  min-height:100%;
  background:#fdf8f3;
  font-family:'Exo 2',sans-serif;
  color:#3a3230;
}

/* 따뜻한 별빛 배경 */
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse at 20% 10%, #fde8d0 0%, transparent 50%),
    radial-gradient(ellipse at 80% 90%, #e8d8f8 0%, transparent 50%),
    radial-gradient(ellipse at 60% 30%, #d8eef8 0%, transparent 40%);
  pointer-events:none;
  z-index:0;
}

/* 작은 별들 */
body::after{
  content:'✦ ✧ ✦ ✧ ✦ ✧ ✦ ✧ ✦ ✧ ✦';
  position:fixed;top:12px;left:0;right:0;
  text-align:center;
  font-size:10px;color:#c8b8d0;
  letter-spacing:18px;
  pointer-events:none;z-index:0;
}

.screen{
  position:relative;z-index:1;
  display:none;flex-direction:column;align-items:center;
  padding:36px 20px 56px;
  min-height:100vh;
}
.screen.active{display:flex;}

/* ── MAP ── */
.map-header{text-align:center;margin-bottom:28px;}
.map-title{
  font-family:'Orbitron',monospace;
  font-size:clamp(20px,5vw,28px);
  font-weight:900;
  color:#5a4a7a;
  letter-spacing:3px;
  margin-bottom:6px;
}
.map-subtitle{font-size:14px;color:#9a8898;}

.sun-wrap{margin-bottom:16px;}
.sun{
  width:68px;height:68px;border-radius:50%;
  background:radial-gradient(circle at 38% 38%,#fff5c0,#ffd060,#f0a020);
  box-shadow:0 4px 20px rgba(255,180,40,0.35);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:#8a5010;
  font-family:'Orbitron',monospace;letter-spacing:1px;
}

.planet-list{
  display:flex;flex-direction:column;gap:10px;
  width:100%;max-width:520px;
}

.planet-row{
  display:flex;align-items:center;gap:16px;
  background:#fff;
  border:1.5px solid #ede6f0;
  border-radius:20px;
  padding:14px 18px;
  cursor:pointer;
  transition:transform 0.15s,box-shadow 0.15s;
  -webkit-user-select:none;user-select:none;
  box-shadow:0 2px 8px rgba(120,80,160,0.07);
}
.planet-row:active:not(.locked){transform:scale(0.98);box-shadow:0 1px 4px rgba(120,80,160,0.1);}
.planet-row.locked{opacity:0.4;cursor:not-allowed;pointer-events:none;}

.planet-orb{
  width:52px;height:52px;border-radius:50%;flex-shrink:0;
  box-shadow:0 3px 10px rgba(0,0,0,0.12);
  transition:box-shadow 0.3s;
}
.planet-orb.spinning{animation:spin 10s linear infinite;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

.planet-info{flex:1;min-width:0;}
.planet-name{
  font-family:'Orbitron',monospace;
  font-size:clamp(13px,3vw,15px);
  font-weight:700;color:#3a3260;
}
.planet-status{font-size:12px;color:#b0a0b8;margin-top:3px;}
.planet-status.cleared{color:#60b880;font-weight:600;}
.planet-status.available{color:#9a80c0;}
.medal-col{font-size:24px;flex-shrink:0;min-width:30px;text-align:center;}

/* ── GAME ── */
#game-screen{gap:0;justify-content:flex-start;padding-top:20px;}

.game-topbar{
  width:100%;max-width:520px;
  display:flex;align-items:center;gap:12px;
  margin-bottom:20px;
}
.back-btn{
  width:36px;height:36px;border-radius:50%;
  background:#fff;border:1.5px solid #ede6f0;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer;flex-shrink:0;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
  -webkit-user-select:none;user-select:none;
}
.back-btn:active{background:#f5f0f8;}
.prog-wrap{
  flex:1;height:10px;
  background:#ede6f0;
  border-radius:5px;overflow:hidden;
}
.prog-fill{
  height:100%;
  background:linear-gradient(90deg,#c8a0e8,#9a70c8);
  border-radius:5px;transition:width 0.4s;
}
.q-counter{
  font-family:'Orbitron',monospace;
  font-size:11px;color:#b0a0b8;flex-shrink:0;
}

.planet-badge{
  display:flex;align-items:center;gap:10px;
  margin-bottom:20px;
}
.badge-orb{
  width:36px;height:36px;border-radius:50%;
  box-shadow:0 2px 8px rgba(0,0,0,0.15);
}
.badge-name{
  font-family:'Orbitron',monospace;
  font-size:13px;font-weight:700;color:#5a4a7a;
  letter-spacing:1px;
}

.question-card{
  background:#fff;
  border:1.5px solid #ede6f0;
  border-radius:24px;
  padding:32px 28px 24px;
  text-align:center;
  width:100%;max-width:520px;
  box-shadow:0 4px 16px rgba(120,80,160,0.08);
  margin-bottom:16px;
}
.question-text{
  font-family:'Orbitron',monospace;
  font-size:clamp(24px,6vw,36px);
  font-weight:900;
  color:#3a3260;
  letter-spacing:3px;
  margin-bottom:20px;
  line-height:1.3;
}
.countdown-area{
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.countdown-pip{
  width:12px;height:12px;border-radius:50%;
  background:#ede6f0;transition:background 0.3s;
}
.countdown-pip.active{background:#c8a0e8;}
.countdown-label{font-size:13px;color:#b0a0b8;}

.score-row{
  display:flex;gap:16px;margin-bottom:16px;
}
.score-chip{
  display:flex;align-items:center;gap:6px;
  background:#fff;border:1.5px solid #ede6f0;
  border-radius:20px;padding:6px 14px;
  font-size:13px;font-weight:600;
  box-shadow:0 1px 4px rgba(0,0,0,0.05);
}
.score-chip.correct{border-color:#a8e0c0;color:#40a060;}
.score-chip.wrong{border-color:#f0c0c0;color:#c04040;}

.cards-grid{
  display:grid;gap:10px;
  width:100%;max-width:520px;
  margin-bottom:16px;
}
.answer-card{
  background:#fff;
  border:2px solid #ede6f0;
  border-radius:18px;
  padding:clamp(16px,3.5vw,22px) 8px;
  text-align:center;
  cursor:pointer;
  font-family:'Orbitron',monospace;
  font-size:clamp(18px,4vw,26px);
  font-weight:700;
  color:#3a3260;
  transition:border-color 0.15s,background 0.15s,transform 0.1s;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);
}
.answer-card:active:not(.disabled){transform:scale(0.96);}
.answer-card.disabled{pointer-events:none;opacity:0.7;}
.answer-card.correct{
  background:#e8f8ee;border-color:#60b880;color:#30804a;
}
.answer-card.wrong{
  background:#fde8e8;border-color:#e06060;color:#a03030;
}

.next-btn{
  width:100%;max-width:520px;
  padding:18px;
  background:#7a50b8;
  border:none;border-radius:18px;
  font-family:'Orbitron',monospace;
  font-size:15px;font-weight:700;
  color:#fff;letter-spacing:2px;
  cursor:pointer;
  box-shadow:0 4px 16px rgba(120,80,180,0.25);
  display:none;
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
.next-btn:active{background:#6a40a8;transform:scale(0.99);}
.next-btn.visible{display:block;}

/* ── RESULT ── */
#result-screen{justify-content:center;gap:20px;}

.result-card{
  background:#fff;
  border:1.5px solid #ede6f0;
  border-radius:28px;
  padding:36px 28px;
  text-align:center;
  width:100%;max-width:400px;
  box-shadow:0 6px 24px rgba(120,80,160,0.1);
  display:flex;flex-direction:column;align-items:center;gap:14px;
}
.result-planet{
  width:80px;height:80px;border-radius:50%;
  box-shadow:0 4px 16px rgba(0,0,0,0.15);
  animation:floatup 3s ease-in-out infinite;
}
@keyframes floatup{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-8px);}
}
.result-medal{font-size:56px;line-height:1;}
.result-title{
  font-family:'Orbitron',monospace;
  font-size:clamp(16px,4vw,22px);
  font-weight:900;color:#3a3260;
  letter-spacing:3px;
}
.result-score{
  font-family:'Orbitron',monospace;
  font-size:clamp(32px,8vw,44px);
  font-weight:900;color:#7a50b8;
}
.result-sub{font-size:15px;color:#9a8898;}

.result-btns{
  display:flex;gap:10px;flex-wrap:wrap;
  justify-content:center;
  width:100%;max-width:400px;
}
.btn{
  font-family:'Exo 2',sans-serif;
  font-size:15px;font-weight:600;
  padding:16px 20px;border-radius:16px;
  border:1.5px solid #ede6f0;
  background:#fff;color:#5a4a7a;
  cursor:pointer;flex:1;min-width:130px;
  box-shadow:0 2px 8px rgba(0,0,0,0.06);
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
.btn:active{background:#f5f0f8;transform:scale(0.98);}
.btn.primary{
  background:#7a50b8;border-color:#7a50b8;
  color:#fff;
  box-shadow:0 4px 14px rgba(120,80,180,0.3);
}
.btn.primary:active{background:#6a40a8;}

/* 토스트 */
.toast{
  position:fixed;
  bottom:36px;left:50%;transform:translateX(-50%);
  padding:12px 28px;border-radius:24px;
  font-family:'Orbitron',monospace;
  font-size:14px;font-weight:700;letter-spacing:2px;
  opacity:0;transition:opacity 0.25s;
  pointer-events:none;z-index:999;white-space:nowrap;
}
.toast.show{opacity:1;}
.toast.ok{background:#e8f8ee;color:#30804a;border:1.5px solid #a0d8b0;box-shadow:0 4px 16px rgba(60,160,80,0.15);}
.toast.no{background:#fde8e8;color:#a03030;border:1.5px solid #f0b0b0;box-shadow:0 4px 16px rgba(200,60,60,0.12);}

</style>
</head>
<body>
<div id="toast" class="toast"></div>

<!-- MAP -->
<div id="map-screen" class="screen active">
  <div class="map-header">
    <div class="map-title">태양계 탐험</div>
    <div class="map-subtitle">행성을 눌러 수학 퀴즈에 도전하세요</div>
  </div>
  <div class="sun-wrap"><div class="sun">태양</div></div>
  <div class="planet-list">
    <div class="planet-row " id="prow-0" onclick="onPlanetClick(0)">
      <div class="planet-orb" id="porb-0" style="background:radial-gradient(circle at 38% 35%,#fff8 20%,#c9b8a8 100%);"></div>
      <div class="planet-info">
        <div class="planet-name">수성</div>
        <div class="planet-status" id="pstatus-0">도전 가능</div>
      </div>
      <div class="medal-col" id="pmedal-0"></div>
    </div>
    <div class="planet-row locked" id="prow-1" onclick="onPlanetClick(1)">
      <div class="planet-orb" id="porb-1" style="background:radial-gradient(circle at 38% 35%,#fff8 20%,#d4c8be 100%);"></div>
      <div class="planet-info">
        <div class="planet-name">금성</div>
        <div class="planet-status" id="pstatus-1">잠금</div>
      </div>
      <div class="medal-col" id="pmedal-1">🔒</div>
    </div>
    <div class="planet-row locked" id="prow-2" onclick="onPlanetClick(2)">
      <div class="planet-orb" id="porb-2" style="background:radial-gradient(circle at 38% 35%,#fff8 20%,#d4c8be 100%);"></div>
      <div class="planet-info">
        <div class="planet-name">지구</div>
        <div class="planet-status" id="pstatus-2">잠금</div>
      </div>
      <div class="medal-col" id="pmedal-2">🔒</div>
    </div>
    <div class="planet-row locked" id="prow-3" onclick="onPlanetClick(3)">
      <div class="planet-orb" id="porb-3" style="background:radial-gradient(circle at 38% 35%,#fff8 20%,#d4c8be 100%);"></div>
      <div class="planet-info">
        <div class="planet-name">화성</div>
        <div class="planet-status" id="pstatus-3">잠금</div>
      </div>
      <div class="medal-col" id="pmedal-3">🔒</div>
    </div>
    <div class="planet-row locked" id="prow-4" onclick="onPlanetClick(4)">
      <div class="planet-orb" id="porb-4" style="background:radial-gradient(circle at 38% 35%,#fff8 20%,#d4c8be 100%);"></div>
      <div class="planet-info">
        <div class="planet-name">목성</div>
        <div class="planet-status" id="pstatus-4">잠금</div>
      </div>
      <div class="medal-col" id="pmedal-4">🔒</div>
    </div>
    <div class="planet-row locked" id="prow-5" onclick="onPlanetClick(5)">
      <div class="planet-orb" id="porb-5" style="background:radial-gradient(circle at 38% 35%,#fff8 20%,#d4c8be 100%);"></div>
      <div class="planet-info">
        <div class="planet-name">토성</div>
        <div class="planet-status" id="pstatus-5">잠금</div>
      </div>
      <div class="medal-col" id="pmedal-5">🔒</div>
    </div>
    <div class="planet-row locked" id="prow-6" onclick="onPlanetClick(6)">
      <div class="planet-orb" id="porb-6" style="background:radial-gradient(circle at 38% 35%,#fff8 20%,#d4c8be 100%);"></div>
      <div class="planet-info">
        <div class="planet-name">천왕성</div>
        <div class="planet-status" id="pstatus-6">잠금</div>
      </div>
      <div class="medal-col" id="pmedal-6">🔒</div>
    </div>
    <div class="planet-row locked" id="prow-7" onclick="onPlanetClick(7)">
      <div class="planet-orb" id="porb-7" style="background:radial-gradient(circle at 38% 35%,#fff8 20%,#d4c8be 100%);"></div>
      <div class="planet-info">
        <div class="planet-name">해왕성</div>
        <div class="planet-status" id="pstatus-7">잠금</div>
      </div>
      <div class="medal-col" id="pmedal-7">🔒</div>
    </div>
  </div>
</div>

<!-- GAME -->
<div id="game-screen" class="screen">
  <div class="game-topbar">
    <div class="back-btn" onclick="goHome()">←</div>
    <div class="prog-wrap"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    <span class="q-counter" id="q-counter">1 / 11</span>
  </div>

  <div class="planet-badge">
    <div class="badge-orb" id="badge-orb"></div>
    <div class="badge-name" id="badge-name">수성</div>
  </div>

  <div class="question-card">
    <div class="question-text" id="question-text">? + ? + ?</div>
    <div class="countdown-area">
      <div class="countdown-pip" id="pip-4"></div>
      <div class="countdown-pip" id="pip-3"></div>
      <div class="countdown-pip" id="pip-2"></div>
      <div class="countdown-pip" id="pip-1"></div>
      <div class="countdown-pip" id="pip-0"></div>
      <span class="countdown-label" id="countdown-label">잠시 생각해보세요</span>
    </div>
  </div>

  <div class="score-row">
    <div class="score-chip correct">✓ <span id="score-correct">0</span></div>
    <div class="score-chip wrong">✗ <span id="score-wrong">0</span></div>
  </div>

  <div class="cards-grid" id="cards-grid"></div>
  <button class="next-btn" id="next-btn" onclick="nextQuestion()">다음 ▶</button>
</div>

<!-- RESULT -->
<div id="result-screen" class="screen">
  <div class="result-card">
    <div class="result-planet" id="result-planet"></div>
    <div class="result-medal" id="result-medal">🥇</div>
    <div class="result-title" id="result-title">금메달!</div>
    <div class="result-score" id="result-score">11 / 11</div>
    <div class="result-sub" id="result-sub">완벽해요!</div>
  </div>
  <div class="result-btns">
    <button class="btn" id="retry-btn" onclick="retryGame()">다시 도전</button>
    <button class="btn primary" onclick="goHome()">🪐 행성 지도로</button>
  </div>
</div>

<script>
var PLANETS=[
  {name:"수성",color:"#c9b8a8",bg:"#e8d8c8"},
  {name:"금성",color:"#e8c97a",bg:"#f8e8a0"},
  {name:"지구",color:"#7ab8e8",bg:"#a0d0f0"},
  {name:"화성",color:"#e87a7a",bg:"#f0a0a0"},
  {name:"목성",color:"#e8a87a",bg:"#f0c8a0"},
  {name:"토성",color:"#d4b896",bg:"#e8d0b0"},
  {name:"천왕성",color:"#7ae8e0",bg:"#a0f0e8"},
  {name:"해왕성",color:"#9a8ae8",bg:"#c0b0f8"}
];
var CARD_COUNTS=[2,2,2,2,4,4,4,9,9,25,25];
var MEDALS={gold:"🥇",silver:"🥈",bronze:"🥉",fail:"💫"};
var MEDAL_RANK={gold:4,silver:3,bronze:2,fail:1};
var progress=[null,null,null,null,null,null,null,null];
var cur=0,questions=[],qIdx=0,correct=0,wrong=0;
var canAnswer=false,timer=null,answered=false;

function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}

function makeQ(){
  if(Math.random()<0.5){
    var a,b,c;
    do{a=ri(1,47);b=ri(1,47);c=ri(1,47);}while(a+b+c>=100);
    return {text:a+" + "+b+" + "+c+" = ?",ans:a+b+c};
  }else{
    var a=ri(1,10),b=ri(1,10),c=ri(1,10);
    return {text:a+" × "+b+" × "+c+" = ?",ans:a*b*c};
  }
}

function makeOpts(ans,n){
  var arr=[ans],t=0;
  while(arr.length<n&&t<300){
    var d=ri(-Math.max(12,Math.floor(ans*0.6)),Math.max(12,Math.floor(ans*0.6)));
    var v=ans+d,dup=false;
    for(var k=0;k<arr.length;k++)if(arr[k]===v){dup=true;break;}
    if(v>0&&!dup)arr.push(v);
    t++;
  }
  while(arr.length<n)arr.push(ans+arr.length*4+1);
  return shuffle(arr);
}

function shuffle(a){
  for(var i=a.length-1;i>0;i--){
    var j=ri(0,i),tmp=a[i];a[i]=a[j];a[j]=tmp;
  }
  return a;
}

function medal(score){
  if(score===11)return"gold";
  if(score>=9)return"silver";
  if(score>=7)return"bronze";
  return"fail";
}

function orbStyle(p,spinning){
  var s="background:radial-gradient(circle at 38% 35%,#fff8 10%,"+p.color+" 60%,"+p.bg+" 100%);";
  if(spinning)s+="box-shadow:0 4px 16px "+p.color+"88;";
  return s;
}

function updateMap(){
  for(var i=0;i<8;i++){
    var m=progress[i];
    var locked=i>0&&progress[i-1]===null;
    var row=document.getElementById("prow-"+i);
    var orb=document.getElementById("porb-"+i);
    var st=document.getElementById("pstatus-"+i);
    var md=document.getElementById("pmedal-"+i);
    var p=PLANETS[i];
    if(!row)continue;
    if(locked){
      row.className="planet-row locked";
      orb.style.background="radial-gradient(circle at 38% 35%,#fff4,#d4c8be)";
      orb.style.boxShadow="";
      orb.className="planet-orb";
      st.textContent="잠금";st.className="planet-status";
      md.textContent="🔒";
    }else if(m){
      row.className="planet-row";
      orb.style=orbStyle(p,true);
      orb.className="planet-orb spinning";
      st.textContent="클리어!";st.className="planet-status cleared";
      md.textContent=MEDALS[m];
    }else{
      row.className="planet-row";
      orb.style=orbStyle(p,false);
      orb.className="planet-orb";
      st.textContent="도전 가능";st.className="planet-status available";
      md.textContent="";
    }
  }
}

function onPlanetClick(i){
  if(i>0&&progress[i-1]===null)return;
  startGame(i);
}

function startGame(pi){
  cur=pi;questions=[];
  for(var i=0;i<11;i++)questions.push(makeQ());
  qIdx=0;correct=0;wrong=0;
  show("game-screen");loadQ();
}

function loadQ(){
  answered=false;
  var q=questions[qIdx];
  var n=CARD_COUNTS[qIdx];
  var p=PLANETS[cur];

  document.getElementById("q-counter").textContent=(qIdx+1)+" / 11";
  document.getElementById("prog-fill").style.width=((qIdx/11)*100)+"%";
  document.getElementById("question-text").textContent=q.text;
  document.getElementById("score-correct").textContent=correct;
  document.getElementById("score-wrong").textContent=wrong;
  document.getElementById("badge-name").textContent=p.name;
  document.getElementById("badge-orb").style=orbStyle(p,false);

  var grid=document.getElementById("cards-grid");
  grid.style.gridTemplateColumns=n<=4?"1fr 1fr":n<=9?"repeat(3,1fr)":"repeat(5,1fr)";
  grid.innerHTML="";

  var opts=makeOpts(q.ans,n);
  for(var i=0;i<opts.length;i++){
    (function(opt){
      var c=document.createElement("div");
      c.className="answer-card disabled";
      c.textContent=opt;
      c.onclick=function(){pick(opt,q.ans,c);};
      grid.appendChild(c);
    })(opts[i]);
  }

  document.getElementById("next-btn").className="next-btn";
  canAnswer=false;
  startCountdown();
}

function startCountdown(){
  clearInterval(timer);
  var s=5;
  var label=document.getElementById("countdown-label");
  label.textContent="잠시 생각해보세요";
  for(var k=0;k<5;k++){
    var pip=document.getElementById("pip-"+k);
    if(pip)pip.className="countdown-pip active";
  }
  timer=setInterval(function(){
    s--;
    var pip=document.getElementById("pip-"+s);
    if(pip)pip.className="countdown-pip";
    if(s<=0){
      clearInterval(timer);
      canAnswer=true;
      label.textContent="답을 골라보세요!";
      var cards=document.querySelectorAll(".answer-card");
      for(var i=0;i<cards.length;i++)cards[i].classList.remove("disabled");
    }
  },1000);
}

function pick(sel,ans,el){
  if(!canAnswer||answered)return;
  clearInterval(timer);
  canAnswer=false;answered=true;
  var cards=document.querySelectorAll(".answer-card");
  for(var i=0;i<cards.length;i++)cards[i].classList.add("disabled");
  var ok=sel===ans;
  el.classList.add(ok?"correct":"wrong");
  if(!ok){
    for(var i=0;i<cards.length;i++){
      if(parseInt(cards[i].textContent)===ans)cards[i].classList.add("correct");
    }
  }
  showToast(ok?"잘했어요!":"아쉬워요",ok?"ok":"no");
  if(ok)correct++;else wrong++;
  document.getElementById("score-correct").textContent=correct;
  document.getElementById("score-wrong").textContent=wrong;

  // 다음 버튼 표시 - 아이가 직접 넘기게
  document.getElementById("next-btn").className="next-btn visible";
}

function nextQuestion(){
  qIdx++;
  if(qIdx<11)loadQ();
  else showResult();
}

function showToast(msg,type){
  var el=document.getElementById("toast");
  el.textContent=msg;el.className="toast "+type+" show";
  setTimeout(function(){el.classList.remove("show");},1200);
}

function showResult(){
  show("result-screen");
  var m=medal(correct);
  if(m!=="fail"){
    var prev=progress[cur];
    if(prev===null||(MEDAL_RANK[m]||0)>(MEDAL_RANK[prev]||0))progress[cur]=m;
  }
  updateMap();
  var p=PLANETS[cur];
  var rp=document.getElementById("result-planet");
  rp.style=orbStyle(p,false);
  var titles={gold:"금메달!",silver:"은메달!",bronze:"동메달!",fail:"괜찮아요!"};
  var subs={gold:"완벽해요! 모든 문제를 맞혔어요 🌟",silver:"아주 잘했어요!",bronze:"잘했어요, 다시 하면 더 잘할 수 있어요!",fail:"다시 도전해봐요, 할 수 있어요!"};
  document.getElementById("result-medal").textContent=MEDALS[m];
  document.getElementById("result-title").textContent=titles[m];
  document.getElementById("result-score").textContent=correct+" / 11";
  document.getElementById("result-sub").textContent=subs[m];
  document.getElementById("retry-btn").style.display=m==="fail"?"":"none";
}

function retryGame(){startGame(cur);}
function goHome(){clearInterval(timer);updateMap();show("map-screen");}
function show(id){
  var screens=document.querySelectorAll(".screen");
  for(var i=0;i<screens.length;i++)screens[i].classList.remove("active");
  document.getElementById(id).classList.add("active");
}
</script>
</body>
</html>
